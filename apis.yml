name: API Fortress
description: API Fortress was an API testing and monitoring platform that let engineering teams author,
  run, and continuously monitor functional and integration tests against REST and SOAP APIs, in the cloud
  or via an on-premise Docker-based agent. It was acquired by Sauce Labs in January 2020 and its capabilities
  were folded into the Sauce Labs API Testing product. The standalone apifortress.com developer surface has
  since been retired; as of this enrichment pass the domain no longer resolves (parked Route53 nameservers,
  no A records), the apifortress GitHub organization returns 404, and there is no live first-party API, docs,
  SDK, or well-known surface remaining to enrich.
